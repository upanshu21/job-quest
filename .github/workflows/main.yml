name: Python CI

on:
  push:
    branches: [ main, feature/workflow ]
  pull_request:
    branches: [ main, feature/workflow ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Package application
      run: |
        zip -r deployment.zip . -x "*.git*"
        
    - name: Deploy to EC2
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        EC2_HOST: ${{ secrets.EC2_HOST }}
      run: |
        echo "$SSH_PRIVATE_KEY" > ssh_key.pem
        chmod 600 ssh_key.pem
        ssh -vvv -i ssh_key.pem -o StrictHostKeyChecking=no ubuntu@${EC2_HOST} '
          rm -rf /home/ubuntu/scraper && mkdir -p /home/ubuntu/scraper
          '
        scp -o StrictHostKeyChecking=no -i ssh_key.pem deployment.zip ubuntu@${EC2_HOST}:/home/ubuntu/scraper/
        ssh -o StrictHostKeyChecking=no -i ssh_key.pem ubuntu@${EC2_HOST} '
          cd /home/ubuntu/scraper && 
          unzip -o deployment.zip &&
          python3 -m venv venv && 
          virtualenv venv
          source venv/bin/activate &&
          pip install -r requirements.txt
          nohup python3 -m app.main > output.log 2>&1 &'
        rm ssh_key.pem
        
    